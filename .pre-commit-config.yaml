repos:
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff-check
        additional_dependencies: [ruff==0.17.3]
      - id: nbqa-ruff-format
        additional_dependencies: [ruff==0.17.3]
  - repo: local
    hooks:
      - id: check-headers
        name: check-headers
        description: Check that headers start with H2.
        language: python
        entry: python scripts/check_headers.py
        additional_dependencies: ["nbformat", "rich"]
        files: "ipynb"
